<main class="catalog-page">
  <header class="catalog-header">
    <div>
      <p>CATALOGO MASCULINO</p>
      <h1>Encuentra tu proxima prenda</h1>
    </div>
    @if (hasSession()) {
      <button mat-stroked-button type="button" (click)="logout()">Cerrar sesión</button>
    }
  </header>

  <mat-card class="filter-panel">
    <app-product-filter
      [categorias]="categorias"
      [tallas]="tallas"
      [colores]="colores"
      (filtersChange)="onFiltersChange($event)"
    />
  </mat-card>

  @if (isLoading) {
    <div class="loading-state">
      <mat-spinner diameter="42"></mat-spinner>
      <span>Cargando catalogo...</span>
    </div>
  } @else if (products.length === 0) {
    <mat-card class="empty-state">No se encontraron productos con los filtros aplicados.</mat-card>
  } @else {
    <section class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
      @for (producto of products; track producto.id_producto) {
        <app-product-card [producto]="producto" />
      }
    </section>
  }
  @if (hasSession()) {<app-recommendations-section />}
</main>
