services:
  database:
    image: postgres:16-alpine
    container_name: vestidor-virtual-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vestidor_virtual}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: vestidor-virtual-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-vestidor_virtual}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
    volumes:
      - ./backend:/app
    depends_on:
      - database
    networks:
      - internal
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend-web
    container_name: vestidor-virtual-frontend
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - internal
    ports:
      - "4200:4200"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
