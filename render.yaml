databases:
  - name: vestidor-db
    databaseName: vestidor_virtual
    user: vestidor_user
    plan: free

services:
  # 1. API Backend (FastAPI + Python 3.12)
  - type: web
    name: vestidor-virtual-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.database.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vestidor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.2

  # 2. Frontend Web (Angular 17 Static Site)
  - type: web
    name: vestidor-virtual-frontend
    runtime: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/vestidor-virtual-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: vestidor-virtual-backend
          property: host
